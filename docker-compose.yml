services:
  db:
    image: imresamu/postgis:15-3.3
    container_name: drivematch_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drivematch}
      POSTGRES_USER: ${POSTGRES_USER:-drivematch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drivematch_user} -d ${POSTGRES_DB:-drivematch}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: drivematch_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  bot:
    build: .
    container_name: drivematch_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - .:/app
      - ./drivematch/sessions:/app/drivematch/sessions

volumes:
  postgres_data:
  redis_data: