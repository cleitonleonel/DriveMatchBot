services:
  redis:
    image: redis:latest
    container_name: drivematch_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  bot:
    build: .
    container_name: drivematch_bot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/drivematch}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - ./drivematch/sessions:/app/drivematch/sessions

  # Serviço DB opcional em container (para Ubuntu/Windows que não usam Postgres nativo)
  db:
    profiles: ["with-db"]
    image: postgis/postgis:15-3.3-alpine
    container_name: drivematch_db
    restart: always
    environment:
      POSTGRES_DB: drivematch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drivematch"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data: